site_name: My Notes Collection
site_description: A comprehensive collection of personal notes on cyber security, ethical hacking, and related topics
site_url: https://TheMalevolentOne1.github.io/
site_author: TheMalevolentOne1
repo_name: TheMalevolentOne1/My-Notes-Collection
repo_url: https://github.com/TheMalevolentOne1/themalevolentone1.github.io
edit_uri: edit/main
copyright: Hello World! Welcome to my Personal Notes Collection!

theme:
  name: material
  custom_dir: overrides
  palette:
    # Dark mode configuration
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to Light Mode
    # Light mode configuration
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to Dark Mode
  
  font:
    text: Roboto
    code: JetBrains Mono
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
    tag:
      shield: material/shield-lock
      security: material/security
      hack: material/spider-web
      guide: material/book-open-variant
      linux: material/linux
      windows: material/microsoft-windows
      lock-open: material/lock-open
  
  icon: https://avatars.githubusercontent.com/u/112825149?v=4
  
  features:
    # Content features
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.action.edit
    - content.action.view
    - content.tabs.link
    
    # Navigation features
    - navigation.top
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.footer
    
    # Table of contents
    - toc.follow
    - toc.integrate
    
    # Search features
    - search.suggest
    - search.highlight
    - search.share
    
    # Header features
    - header.autohide
    - announce.dismiss

nav:
  - 🏠 Home: index
  - 📖 My Library: Books/My Library
  - 🛡️ Notes Contents: My Learning/Notes/Notes/
  - 🎥 Video Notes Contents: My Learning/Video Notes/Video Notes/
  - 📚 Guide Contents: My Learning/Guides/Guides/

plugins:
  - callouts
  # Search configuration
  - search:
      lang: en
      separator: '[\s\-\.]+'
      prebuild_index: true
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - excalidraw
  # File exclusion
  - exclude:
      glob:
        - "*.tmp"
        - "*.bak"
        - "*.old"
        - ".cache/*"
        - "*.py[co]"
        - "__pycache__/*"
  
  # Diagram support
  - mermaid2:
      arguments:
        theme: 'dark'
        themeVariables:
          primaryColor: '#ff6e40'
          primaryTextColor: '#fff'
          primaryBorderColor: '#ff6e40'
          lineColor: '#f66'
          secondaryColor: '#705770'
          tertiaryColor: '#40536e'
  
  # Wiki-style links
  - roamlinks:
      enable_transforms: true
  
  # Tag support
  - tags:
      tags_file: tags.md
  
  # HTML minification
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  
  # Auto page discovery
  - awesome-pages:
      collapse_single_pages: false

markdown_extensions:
  - nl2br
  - admonition
  - pymdownx.details
  - pymdownx.superfences 

  # Code blocks and syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Mermaid diagrams
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  # Text formatting and enhancements
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic:
      mode: view
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  
  # Lists and tables
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - def_list
  - abbr
  
  # Content organization
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  
  # HTML and attributes
  - attr_list
  - md_in_html
  
  # Emoji support
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  
  # Other utilities
  - pymdownx.snippets:
      check_paths: true
  - nl2br
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.escapeall:
      hardbreak: true
      nbsp: true
  - meta


# JavaScript dependencies
extra_javascript:
